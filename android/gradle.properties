org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Mhambi configuration (override in ~/.gradle/gradle.properties or android/local.properties; never commit secrets) ----
# Backend REST API base URL. MUST end with /api/v1/ . Do not use "localhost": inside BlueStacks/phones it points to the device itself.
# You can also change it at run time from the login screen (Server settings), so rebuilding is not required.
mhambi.apiBaseUrl=https://REPLACE-WITH-YOUR-SERVICE.onrender.com/api/v1/
# OAuth 2.0 *Web application* client ID from Google Cloud (used to verify Google Sign-In on the server). Leave blank to hide the Google button.
mhambi.googleWebClientId=
